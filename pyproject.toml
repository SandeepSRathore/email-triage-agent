[project]
name = "email-triage"
version = "0.1.0"
description = "Labels Gmail inbox mail by category using OpenAI"
readme = "README.md"
authors = [
    { name = "SandeepSRathore", email = "sandeeprathore9211@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "openai>=3.23.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
triage = "email_triage.cli:main"
